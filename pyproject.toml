[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teste_tecnico_chatbot"
version = "1.0.0"
description = "Chatbot inteligente com RAG, Tools, Feedback dinâmico e interface Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core & Web Framework
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    
    # AI & Google Generative AI
    "google-genai>=2.20.0",
    "google-generativeai>=0.8.6",
    "google-api-core>=2.33.0",
    
    # VectorStore & RAG
    "chromadb>=1.5.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    
    # Frontend (Streamlit)
    "streamlit>=1.62.0",
    "altair>=6.2.2",
    
    # Utilitários gerais presentes no ambiente
    "tenacity>=9.1.4",
    "tqdm>=4.70.0",
    "PyYAML>=6.0.3",
    "orjson>=3.12.0"
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "httpx>=0.28.1",
    "anyio>=4.14.2"
]

[tool.setuptools.packages.find]
include = ["src*", "UI*"]